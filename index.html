<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caloricio — Calculadora de Calorias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#84cc16" />
  <link rel="apple-touch-icon" href="img/icone-192.png" />
</head>
<body>
  <main class="container">
    <header class="topo">
      <h1>Caloricio</h1>
      <p class="subtitulo">Sua calculadora de calorias do desafio</p>
    </header>

    <!--
      Mascote: imagem inteira trocada por categoria/estado (ver mascote.js
      caminhoImagem). Cada categoria com fantasia pronta tem 2 arquivos
      (normal/desconfiado); categorias sem fantasia usam o visual genérico.
    -->
    <!--
      Mascote e resultado ficam dentro do mesmo card porque é essa composição
      que vira a imagem exportada. A borda só aparece depois de calcular, mas
      já ocupa espaço desde o início (transparente) pra não deslocar o layout.
    -->
    <div class="cartao" id="cartao">
    <figure class="mascote" id="mascote" data-visual="neutro" data-desconfiado="false">
      <!--
        Três camadas de transform aninhadas, cada uma com sua animação, porque
        um mesmo elemento não consegue rodar transforms independentes:
        reacao (squash on troca de estado) > flutua (sobe/desce) > img (respira).
      -->
      <div class="mascote-palco">
        <div class="mascote-idle">
          <div class="mascote-reacao">
            <div class="mascote-flutua">
              <!--
                Começa com um pixel transparente em vez de apontar pra uma arte:
                app.js escolhe entre WebP e PNG antes do primeiro desenho, e um
                src real aqui faria o navegador baixar o PNG (122KB) só pra
                descartá-lo em seguida. width/height seguram o espaço no layout.
              -->
              <img id="mascote-img"
                   src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                   alt="Caloricio te esperando começar" width="690" height="740" />
            </div>
          </div>
        </div>
        <div class="mascote-sombra" aria-hidden="true"></div>
      </div>
      <figcaption class="legenda" id="legenda" aria-live="polite"></figcaption>
    </figure>

      <!-- ausente até o primeiro cálculo válido; aparece com transição de reveal -->
      <section class="resultado" id="resultado" hidden aria-live="polite">
        <p class="resultado-rotulo">Você queimou aproximadamente</p>
        <p class="resultado-valor"><span id="kcal">0</span> kcal</p>
        <p class="resultado-detalhe" id="detalhe"></p>
        <p class="resultado-data" id="data-registro"></p>
      </section>
    </div>

    <div class="acoes" id="acoes" hidden>
      <button type="button" class="compartilhar" id="compartilhar">
        Compartilhar imagem
      </button>
      <p class="acoes-aviso" id="acoes-aviso" role="status"></p>
    </div>

    <form id="form" novalidate>
      <div class="campo">
        <label for="sexo">Sexo</label>
        <select id="sexo" name="sexo" required>
          <option value="M">Masculino</option>
          <option value="F">Feminino</option>
        </select>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="idade">Idade (anos)</label>
          <input type="number" id="idade" name="idade" inputmode="numeric" required />
          <p class="erro" id="erro-idade"></p>
        </div>
        <div class="campo">
          <label for="altura">Altura (cm)</label>
          <input type="number" id="altura" name="altura" inputmode="numeric" required />
          <p class="erro" id="erro-altura"></p>
        </div>
        <div class="campo">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" name="peso" inputmode="decimal" step="0.1" required />
          <p class="erro" id="erro-peso"></p>
        </div>
      </div>

      <!--
        Seletor próprio em vez de <select>: o picker nativo do Android achata
        os optgroups e a hierarquia categoria > exercício se perde. Ver seletor.js.
      -->
      <div class="campo">
        <span class="rotulo" id="rotulo-exercicio">Exercício</span>
        <button type="button" class="seletor-botao" id="seletor-botao"
                aria-haspopup="dialog" aria-expanded="false"
                aria-labelledby="rotulo-exercicio seletor-valor">
          <span class="seletor-valor" id="seletor-valor">Selecione o exercício…</span>
          <span class="seletor-seta" aria-hidden="true">▾</span>
        </button>
        <p class="erro" id="erro-exercicio"></p>
      </div>

      <div class="campo">
        <label for="duracao">Duração da atividade (minutos)</label>
        <input type="number" id="duracao" name="duracao" inputmode="numeric" required />
        <p class="erro" id="erro-duracao"></p>
      </div>

      <button type="submit" class="calcular">Calcular calorias</button>

      <p class="lembrete" id="lembrete" hidden>
        Seus dados ficam salvos neste aparelho.
        <button type="button" class="link" id="esquecer">Esquecer</button>
      </p>
    </form>

    <footer class="rodape">
      <p>TMB pela fórmula de Mifflin-St Jeor · valores MET do Compendium of Physical Activities. Resultados são estimativas.</p>
    </footer>
  </main>

  <div class="seletor-fundo" id="seletor-fundo" hidden></div>
  <div class="seletor-painel" id="seletor-painel" role="dialog" aria-modal="true"
       aria-labelledby="seletor-titulo" hidden>
    <header class="seletor-cabecalho">
      <button type="button" class="seletor-icone-botao" id="seletor-voltar" hidden
              aria-label="Voltar para as categorias">‹</button>
      <h2 class="seletor-titulo" id="seletor-titulo">Escolha a categoria</h2>
      <button type="button" class="seletor-icone-botao" id="seletor-fechar"
              aria-label="Fechar">×</button>
    </header>
    <ul class="seletor-lista" id="seletor-lista" role="listbox"></ul>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
